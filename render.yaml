# Render Blueprint — New → Blueprint 로 이 레포를 고르면 아래 설정대로 무료 웹서비스가 만들어짐
services:
  - type: web
    name: fifa-war-bot
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DISCORD_TOKEN
        sync: false # 배포할 때 대시보드에서 입력
